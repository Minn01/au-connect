# Production stack for the AU Connect system on the life.au.edu server.
#
#   cp .env.template .env                                # main app
#   cp .env.admin.example .env.admin                     # admin app
#   cp .env.recommendation.example .env.recommendation   # recommendation api
#   make prod-up
#
# Runs the three app images (pulled from Docker Hub) + MongoDB on one private
# network. The reverse proxy (nginx) and redeploys are handled by the AU team.
#
# nginx routes the AU team add to their existing config:
#   life.au.edu/connect        -> 127.0.0.1:3000   (main)
#   life.au.edu/connect-admin  -> 127.0.0.1:3001   (admin)
# The recommendation api and MongoDB have no host port — internal only.
services:
  au-connect:
    image: ${AU_CONNECT_IMAGE:-tommyzizii/au-connect:latest}
    container_name: au-connect-app
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_started
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - au-network

  admin:
    image: ${ADMIN_IMAGE:-tommyzizii/au-connect-admin:latest}
    container_name: au-connect-admin
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - .env.admin
    depends_on:
      mongo:
        condition: service_started
    ports:
      # Different host port than main; both listen on :3000 inside the container.
      - "127.0.0.1:3001:3000"
    networks:
      - au-network

  recommendation:
    image: ${RECO_IMAGE:-tommyzizii/au-connect-recommendation:latest}
    container_name: au-connect-reco
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - .env.recommendation
    depends_on:
      # Only needed if the service reads MongoDB directly. Harmless otherwise.
      mongo:
        condition: service_started
    # INTERNAL ONLY — no host port. The main app reaches it on the private
    # network at  http://recommendation:8000  (see RECOMMENDATION_SERVICE_URL).
    expose:
      - "8000"
    networks:
      - au-network

  mongo:
    image: mongo:7
    container_name: au-connect-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    # No host port published: the DB is reachable only inside au-network.
    volumes:
      - ac-mongo-data:/data/db
    networks:
      - au-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 10s
      retries: 10

  # One-time replica-set init (Prisma transactions require a replica set).
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - au-network
    restart: "no"
    entrypoint: |
      bash -c '
        echo "Waiting for Mongo...";
        sleep 5;
        mongosh --host mongo:27017 --eval "
          rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongo:27017\" }] })
        " || echo "Replica set already initialized";
      '

networks:
  au-network:

volumes:
  ac-mongo-data:
