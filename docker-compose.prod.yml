# Shared local production simulation for the AU Connect system.
# The application services run prebuilt images on the shared au-network.
services:
  au-connect:
    image: ${AU_CONNECT_IMAGE:-au-connect:local-prod}
    container_name: au-connect-app
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mongodb://mongo:27017/au-connect?directConnection=true
      RECOMMENDATION_SERVICE_URL: http://recommendation:8000
    depends_on:
      mongo:
        condition: service_started
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - au-network

  admin:
    image: ${ADMIN_IMAGE:-au-connect-admin:local-prod}
    container_name: au-connect-admin
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - .env.admin
    depends_on:
      mongo:
        condition: service_started
      mongo-init:
        condition: service_completed_successfully
    ports:
      # Different host port than main; both listen on :3000 inside the container.
      - "127.0.0.1:3001:3000"
    networks:
      - au-network

  recommendation:
    image: ${RECO_IMAGE:-au-connect-recommendation:local-prod}
    container_name: au-connect-reco
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - .env.recommendation
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    # INTERNAL ONLY — no host port. The main app reaches it on the private
    # network at  http://recommendation:8000  (see RECOMMENDATION_SERVICE_URL).
    expose:
      - "8000"
    networks:
      - au-network

  mongo:
    image: mongo:7
    container_name: au-connect-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    # No host port published: the DB is reachable only inside au-network.
    volumes:
      - ac-mongo-data:/data/db
    networks:
      - au-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 10s
      retries: 10

  # One-time replica-set init (Prisma transactions require a replica set).
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - au-network
    restart: "no"
    entrypoint: |
      bash -c '
        if mongosh --host mongo:27017 --quiet --eval "quit(rs.status().ok ? 0 : 1)"; then
          echo "Replica set already initialized";
        else
          mongosh --host mongo:27017 --eval "
            rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongo:27017\" }] })
          ";
        fi
      '

networks:
  au-network:
    name: au-network

volumes:
  ac-mongo-data:
