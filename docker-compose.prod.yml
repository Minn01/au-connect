# Production stack for AU Connect on the life.au.edu server.
#
#   cp .env.template .env   # then fill in .env
#   make prod-up
#
# Runs the app (pulled from Docker Hub) + MongoDB (self-hosted container,
# single-node replica set). Redeployment and the reverse proxy are handled by
# the AU team's own setup (their Watchtower + nginx), not by this file.
services:
  au-connect:
    image: ${AU_CONNECT_IMAGE:-tommyzizii/au-connect:latest}
    container_name: au-connect-app
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_started
      mongo-init:
        condition: service_completed_successfully
    ports:
      # Bind to localhost only — the AU team's nginx proxies public traffic to it.
      - "127.0.0.1:3000:3000"
    labels:
      # Left in place so the AU team's Watchtower can auto-update the app if it
      # filters by this label. Harmless if they don't.
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - au-network

  mongo:
    image: mongo:7
    container_name: au-connect-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    # No host port published: the DB is reachable only inside au-network.
    volumes:
      - ac-mongo-data:/data/db
    networks:
      - au-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 10s
      retries: 10

  # One-time replica-set init (Prisma transactions require a replica set).
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - au-network
    restart: "no"
    entrypoint: |
      bash -c '
        echo "Waiting for Mongo...";
        sleep 5;
        mongosh --host mongo:27017 --eval "
          rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongo:27017\" }] })
        " || echo "Replica set already initialized";
      '

networks:
  au-network:

volumes:
  ac-mongo-data:
