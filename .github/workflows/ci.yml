name: CI

# Catch build breakage before it reaches main.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest

    # Build-time placeholders; next build reads these but never connects.
    env:
      DATABASE_URL: mongodb://placeholder
      GOOGLE_CLIENT_ID: placeholder
      GOOGLE_CLIENT_SECRET: placeholder
      LINKEDIN_CLIENT_ID: placeholder
      LINKEDIN_CLIENT_SECRET: placeholder
      MICROSOFT_CLIENT_ID: placeholder
      MICROSOFT_CLIENT_SECRET: placeholder
      AZURE_STORAGE_ACCOUNT_KEY: placeholder
      AZURE_STORAGE_ACCOUNT_NAME: placeholder
      AZURE_STORAGE_CONNECTION_STRING: placeholder
      AZURE_STORAGE_CONTAINER_NAME: placeholder
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      JWT_SECRET: placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Non-blocking until existing lint debt is paid down.
      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Build
        run: pnpm build
