name: Build and Push Docker Image

# Only production-ready code (merged into main) gets published as an image.
# Pushes to YOUR Docker Hub account. workflow_dispatch lets you also run it
# manually from the Actions tab if needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Produces two tags: :latest and :<short-git-sha> (so every prod build
      # is traceable back to a commit).
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/au-connect
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # The Dockerfile already bakes its own build-time placeholders and runs
      # `next build` internally, so no app env is needed here.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
